name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify bin file exists with shebang
        run: |
          if [ ! -f dist/index.js ]; then
            echo "ERROR: dist/index.js does not exist"
            exit 1
          fi
          if ! head -1 dist/index.js | grep -q '^#!/usr/bin/env node'; then
            echo "ERROR: dist/index.js is missing shebang"
            head -5 dist/index.js
            exit 1
          fi
          echo "OK: dist/index.js exists with proper shebang"
          head -3 dist/index.js

      - name: Unset NODE_AUTH_TOKEN to ensure OIDC is used
        run: unset NODE_AUTH_TOKEN
        env:
          NODE_AUTH_TOKEN: ""

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
